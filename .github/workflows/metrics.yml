name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    # CORREÇÃO 1: evita loop infinito. O lowlighter/metrics commita com o
    # METRICS_TOKEN (PAT), e commits de PAT disparam o gatilho "push" de novo.
    # Ignorando os SVGs, o workflow para de se auto-chamar.
    paths-ignore:
      - "metrics-*.svg"

# CORREÇÃO 2: garante que nunca existam duas execuções mexendo no mesmo
# branch ao mesmo tempo (causa direta do "forced update" no seu log).
concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Clona o repositório com todo o histórico Git
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------------
      # CORREÇÃO 3: o Cartão 3 foi movido para o TOPO.
      # Motivo: o lowlighter/metrics (cartões 1 e 2) faz push sozinho via API
      # do GitHub durante a execução. Se ele rodar antes, o clone local fica
      # desatualizado e o push do Cartão 3 é rejeitado (non-fast-forward).
      # ----------------------------------------------------------------------

      # Cartão 3: Embaixo (Gráfico de Ondas Verde - Tema github-compact)
      - name: Bottom - Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: RaffaGR
          options: "theme=github-compact&area=true&hide_border=true"
          output_path: metrics-bottom.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # CORREÇÃO 4: substitui o git-auto-commit-action (que NÃO faz rebase,
      # apesar do comentário antigo dizer que fazia). Aqui o SVG é guardado,
      # o repo local é ressincronizado com o remoto, o arquivo é reaplicado
      # e só então é feito o commit. Sem conflito possível, sem force-push.
      - name: Commit and push activity graph
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp metrics-bottom.svg /tmp/metrics-bottom.svg

          for i in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            cp /tmp/metrics-bottom.svg metrics-bottom.svg
            git add metrics-bottom.svg

            if git diff --staged --quiet; then
              echo "Nenhuma mudanca no metrics-bottom.svg. Nada a commitar."
              exit 0
            fi

            git commit -m "Update metrics-bottom.svg [skip ci]"

            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Push concluido na tentativa $i."
              exit 0
            fi

            echo "Push rejeitado (tentativa $i). Ressincronizando e tentando de novo..."
            sleep 5
          done

          echo "Falhou apos 3 tentativas."
          exit 1

      # ----------------------------------------------------------------------
      # Cartões 1 e 2 rodam DEPOIS. Eles commitam sozinhos via API,
      # então não dependem do estado do clone local.
      # ----------------------------------------------------------------------

      # Cartão 1: Cima Esquerda (Visão Geral)
      - name: Top Left - Overview Stats
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-top-left.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: RaffaGR
          template: classic
          base: activity, community
          config_theme: tokyonight

      # Cartão 2: Cima Direita (Linguagens)
      - name: Top Right - Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-top-right.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: RaffaGR
          template: classic
          base: ""
          config_theme: tokyonight
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_colors: github
          plugin_languages_limit: 8

      # Cartão 3: Embaixo (Gráfico Isométrico de Contribuições cobrindo a largura)
      # - name: Bottom - Isocalendar
      #   uses: lowlighter/metrics@latest
      #   with:
