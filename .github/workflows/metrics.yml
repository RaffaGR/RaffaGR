name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Clona o repositório com todo o histórico Git
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cartão 1: Cima Esquerda (Visão Geral)
      - name: Top Left - Overview Stats
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-top-left.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: RaffaGR
          template: classic
          base: activity, community
          config_theme: tokyonight

      # Cartão 2: Cima Direita (Linguagens)
      - name: Top Right - Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-top-right.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: RaffaGR
          template: classic
          base: ""
          config_theme: tokyonight
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_colors: github
          plugin_languages_limit: 8

      # Cartão 3: Embaixo (Gráfico de Ondas Verde - Tema github-compact)
      - name: Bottom - Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: RaffaGR
          options: "theme=github-compact&area=true&hide_border=true"
          output_path: metrics-bottom.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # 5. Salva e envia o metrics-bottom.svg com rebase automático para evitar conflito
      - name: Commit and push activity graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update metrics-bottom.svg"
          file_pattern: "metrics-bottom.svg"

