name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: RaffaGR
          template: classic
          
          # Remove o cabeçalho (nome, foto, data) e dados desnecessários de comunidade/espaço
          base: activity
          
          # Aplica o tema escuro oficial
          config_theme: tokyonight
          
          # Configuração do gráfico de Linguagens (Limpo e em Porcentagem)
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
