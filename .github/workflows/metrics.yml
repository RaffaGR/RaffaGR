name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Cartão 1: Cima Esquerda (Visão Geral de Commits e Atividade)
      - name: Top Left - Overview Stats
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-top-left.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: RaffaGR
          template: classic
          base: activity, community
          config_theme: tokyonight

      # Cartão 2: Cima Direita (Linguagens Mais Usadas)
      - name: Top Right - Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-top-right.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: RaffaGR
          template: classic
          base: ""
          config_theme: tokyonight
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_colors: github
          plugin_languages_limit: 8

      # Cartão 3: Embaixo (Gráfico Isométrico de Contribuições cobrindo a largura)
      # - name: Bottom - Isocalendar
      #   uses: lowlighter/metrics@latest
      #   with:
      #     filename: metrics-bottom.svg
      #     token: ${{ secrets.METRICS_TOKEN }}
      #     user: RaffaGR
      #     template: classic
      #     base: ""
      #     config_theme: tokyonight
      #     plugin_isocalendar: yes
      #     plugin_isocalendar_duration: full-year

      # Cartão 3: Embaixo (Substitui o Activity Graph com gráficos de hábitos/commits)
      - name: Bottom - Activity & Habits
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-bottom.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: RaffaGR
          template: classic
          base: ""
          config_theme: tokyonight
          plugin_habits: yes
          plugin_habits_from: 200 # Analisa seus últimos 200 commits
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes # Gera o gráfico visual de barras
